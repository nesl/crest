[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyodom"
version = "0.1.0"
description = "Hardware-Aware NAS for Inertial Odometry"
dependencies = [
    "tensorflow",
    "numpy",
    "optuna",
    "pyserial",
    "pyzmq",
    "addict",
    "pyyaml",
    "keras-tcn",
    "scikit-learn",
    "pandas",
    "numpy-quaternion",
    "giotto-tda",
    "pydometer",
    "tqdm",
    "soundata==1.0.1",
    "librosa==0.11.0",
    "soundfile==0.13.1"
]

[tool.setuptools.packages.find]
where = ["src"]
