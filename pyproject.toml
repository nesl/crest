[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crest"
version = "0.2.0"
description = "Cross-platform runtime evaluation and search for embedded sensing systems"
license = { text = "BSD-3-Clause" }
classifiers = [
    "License :: OSI Approved :: BSD License",
]
dependencies = [
    "tensorflow",
    "numpy",
    "optuna",
    "pyserial",
    "pyzmq",
    "addict",
    "pyyaml",
    "keras-tcn",
    "scikit-learn",
    "pandas",
    "matplotlib",
    "numpy-quaternion",
    "giotto-tda",
    "pydometer",
    "tqdm",
    "pydantic>=2,<3",
    "soundata==1.0.1",
    "librosa==0.11.0",
    "soundfile==0.13.1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Test this checkout instead of unrelated installs, without a manual PYTHONPATH.
pythonpath = ["src"]

[tool.setuptools.package-data]
"crest.optimizers.llm.providers" = ["pricing.json"]
