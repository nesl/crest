# Hardware / device configuration
device:
  name: STM32_NUCLEO_N657X0_Q
  hil: true
  runtime_mode: cadenced                     # Shared runtime control: `back_to_back` or `cadenced`.
  # latency_budget_ms: 200.0                # Optional shared cadence-budget override. Defaults to stride / sampling_rate_hz * 1000.
  serial_port: "/dev/ttyACM0"
  measured_inference_runs: 10                # Number of on-device inference invokes averaged into one measured HIL attempt.
  dut_ready_timeout_s: 12.0                    # Time to wait for STM32_AI_INIT / DUT READY before sending START.
  serial_timeout_s: 12.0                       # Time to wait for the measured runtime pass after START.
  cpu_clock_mhz_options: [200, 300, 400, 600, 800]  # Optional per-trial CPU presets for boards that support runtime clock selection.
  harness_serial_port: "/dev/ttyACM1"
  harness_fqbn: "arduino:mbed_nano:nano33ble"
  harness_auto_flash: "once"
  harness_ready_timeout_s: 5.0
  harness_arm_timeout_s: 5.0
  harness_active_timeout_s: 30.0
  harness_done_timeout_s: 5.0
  stm32:
    project_root: "sketches/stm32/tinyodom_tcn_stm32_lrun"
    appli_flash_address: "0x70100000"
    wake_margin_us: 5000                      # Cadenced wake-up guard band before each release time.
    min_sleep_us: 5000                        # Cadenced minimum Stop-mode sleep request.
    weight_storage_mode: "external_flash"          # Set to external_flash to stage weights into NOR flash.
    weights_memory_pool: "analysis_scripts/stm32_example_project/nucleo_mypool.json"

# Dataset sampling and preprocessing parameters
data:
  sampling_rate_hz: 100           # Hz, derived from dataset
  window_size: 200             # matches TinyODOM paper
  stride: 20                   # matches TinyODOM paper
  directory: "data/oxiod/"
  calibration_windows: 10000    # windows to load for calibration-only jobs; set None for full split. Balances speed vs representative sampling

# Training-time switches and limits
training:
  nas_epochs: 50
  model_epochs: 900
  nas_trials: 135
  nas_multiobjective_population_size: 45 # population size for multi-objective NAS, note: nas trials should be at least 3x this value
  max_total_trials: 270  # safety cap for total attempts to offset pruned/failed runs
  quantization: true
  latency_proxy_max_flops: 30000000.0
  train: true
  energy_aware: true
  # Input mode for HIL sketches: uniform, representative, or real
  input_mode: "uniform"

# Active NAS policy configuration.
# This is the default scalar NAS setup used by the repo.
#
# This example is meant to be the readable config equivalent of the old
# hard-coded score in `model.py`. Each term below exists for a specific reason:
# - reward lower RMSE
# - lightly penalize RAM usage relative to device RAM capacity
# - lightly penalize flash usage relative to device flash capacity
# - penalize latency only after it exceeds the configured latency budget
# - penalize energy when it deviates from an energy budget derived from power
#   budget and latency budget
#
# The `metrics:` subsection defines reusable derived values that make the score
# terms easier to read. The `params.terms:` subsection then says how each value
# contributes to the final scalar score.
nas:
  score:
    type: scoring-function
    metrics:
    # Flash can live in internal flash and, on some targets, external flash.
    # This derived metric lets the score treat total model storage as one value.
      total_flash_bytes:
        type: add
        metrics:
          - flash_bytes
          - external_flash_bytes
    # Reconstruct the old energy target from:
    #   target power (mW) * latency budget (ms) / 1000 = energy budget (mJ)
    # Adjust `power_mw.value` to reflect the per-inference power budget you want.
      energy_budget_mj:
        type: energy-budget-from-power
        power_mw:
          type: literal
          value: 100.0
        duration_ms:
          type: metric
          metric: latency_budget_ms
    params:
      terms:
      # Core accuracy term.
      # Negative weight means lower RMSE produces a higher scalar score.
        - type: weighted
          metric: rmse_total
          weight: -1.0

      # Resource term for RAM usage.
      # This is normalized by the target device RAM capacity so the penalty
      # scales sensibly across boards with different memory sizes.
        - type: normalized-weighted
          metric: ram_bytes
          weight: 0.01
          reference:
            type: metric
            metric: max_ram_bytes

      # Resource term for flash usage.
      # Uses `total_flash_bytes` so internal + external flash are considered
      # together when the target supports both.
        - type: normalized-weighted
          metric: total_flash_bytes
          weight: 0.01
          reference:
            type: metric
            metric: max_flash_bytes

      # Latency policy term.
      # Below the latency budget this contributes nothing.
      # Above the latency budget it subtracts a penalty proportional to the
      # amount of overrun.
        - type: boundary
          metric: latency_ms
          weight: 1.0
          reference:
            type: metric
            metric: latency_budget_ms

      # Energy policy term.
      # This compares measured energy per inference against the derived
      # `energy_budget_mj` target. If energy is below target or above target,
      # the penalty grows with the distance from that target.
        - type: target
          metric: energy_mj_per_inference
          weight: 0.15
          reference:
            type: metric
            metric: energy_budget_mj
  prune:
    rules:
      # Pre-training latency gate.
      # If the measured latency already exceeds the deployment budget, prune
      # the trial before training so NAS does not waste time on it.
      - rule: latency_budget
        metric: latency_ms
        condition: gt
        reference:
          type: metric
          metric: latency_budget_ms
        reason: "Latency exceeds deployment budget"
      # Optional energy gate that reuses the derived budget metric above.
      # - rule: energy_budget
      #   metric: energy_mj_per_inference
      #   condition: gt
      #   reference:
      #     type: metric
      #     metric: energy_budget_mj
      #   reason: "Energy exceeds deployment budget"

# Alternative multi-objective NAS example.
# Uncomment this block if you want a Pareto front instead of one scalar score.
#
# Multi-objective mode does not collapse everything into one scalar. Instead,
# Optuna keeps a frontier of models that trade off accuracy against runtime.
# This is the better fit when you want to inspect the quality/latency trade
# space rather than committing to one fixed weighting policy up front.
# Note: Pruning is not supported for multi objective studies in Optuna, so the 
# `prune.rules` list is left empty here.
#
# When used with `device.runtime_mode: cadenced`, cadenced overload remains
# telemetry in this mode. Trials with `cadenced_deadline_miss_count > 0` or
# `cadenced_active_inference_latency_ms > latency_budget_ms` can still appear
# on the Pareto frontier and should be post-filtered if schedulability is a hard
# requirement.
#
# Example cadenced Pareto setup:
# - objective 1 minimizes total RMSE
# - objective 2 minimizes cadenced energy per window
#
# nas:
#   score:
#     type: multi-objective
#     params:
#       objectives:
#         # Objective 1: minimize overall prediction error.
#         # `rmse_total` is the built-in aggregate `rmse_vel_x + rmse_vel_y`.
#         - metric: rmse_total
#           direction: minimize
#         # Objective 2: minimize cadenced energy per scheduled window.
#         # This gives Optuna a Pareto tradeoff between model quality and energy.
#         - metric: cadenced_energy_mj_per_window
#           direction: minimize
#   prune:
#     rules: []

# Alternative scalar cadenced-feasibility example.
# Uncomment and adapt this shape if you want cadenced schedulability to be a
# hard gate before training. This is the config-level version of "deadline
# misses are infeasible".
#
# nas:
#   score:
#     type: scoring-function
#     metrics:
#       total_flash_bytes:
#         type: add
#         metrics:
#           - flash_bytes
#           - external_flash_bytes
#       energy_budget_mj:
#         type: energy-budget-from-power
#         power_mw:
#           type: literal
#           value: 100.0
#         duration_ms:
#           type: metric
#           metric: latency_budget_ms
#     params:
#       terms:
#         - type: weighted
#           metric: rmse_total
#           weight: -1.0
#         - type: normalized-weighted
#           metric: ram_bytes
#           weight: 0.01
#           reference:
#             type: metric
#             metric: max_ram_bytes
#         - type: normalized-weighted
#           metric: total_flash_bytes
#           weight: 0.01
#           reference:
#             type: metric
#             metric: max_flash_bytes
#         - type: target
#           metric: cadenced_energy_mj_per_window
#           weight: 0.15
#           reference:
#             type: metric
#             metric: energy_budget_mj
#   prune:
#     rules:
#       - rule: latency_budget
#         metric: latency_ms
#         condition: gt
#         reference:
#           type: metric
#           metric: latency_budget_ms
#         reason: "Latency exceeds deployment budget"
#       - rule: cadenced_deadline_budget
#         metric: cadenced_deadline_miss_count
#         condition: gt
#         reference:
#           type: literal
#           value: 0
#         reason: "Cadenced deadline missed"
#       - rule: cadenced_active_latency_budget
#         metric: cadenced_active_inference_latency_ms
#         condition: gt
#         reference:
#           type: metric
#           metric: latency_budget_ms
#         reason: "Cadenced active inference exceeds slot budget"
#       # Optional backend-local cadenced error gate.
#       # - rule: cadenced_phase_ok
#       #   metric: cadenced_error_code
#       #   condition: gt
#       #   reference:
#       #     type: literal
#       #     value: 0
#       #   reason: "Cadenced phase failed"

# Alternative non-HIL scalar example.
# Uncomment and adapt this shape if you want `device.hil: false` and do not
# want the score to depend on measured latency or energy. In proxy mode those
# metrics are unavailable, so keep the score/prune policy limited to metrics
# that still exist before training or after proxy-only compilation.
#
# device:
#   hil: false
#
# nas:
#   score:
#     type: scoring-function
#     metrics:
#       total_flash_bytes:
#         type: add
#         metrics:
#           - flash_bytes
#           - external_flash_bytes
#     params:
#       terms:
#         - type: weighted
#           metric: rmse_total
#           weight: -1.0
#         - type: normalized-weighted
#           metric: ram_bytes
#           weight: 0.01
#           reference:
#             type: metric
#             metric: max_ram_bytes
#         - type: normalized-weighted
#           metric: total_flash_bytes
#           weight: 0.01
#           reference:
#             type: metric
#             metric: max_flash_bytes
#         - type: normalized-weighted
#           metric: flops
#           weight: 0.01
#           reference:
#             type: literal
#             value: 30000000.0
#   prune:
