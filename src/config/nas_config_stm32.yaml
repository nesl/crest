# STM32 N657 OxIOD measured-energy NAS example.

device:
  name: STM32_NUCLEO_N657X0_Q
  hil: true
  compile_when_hil_disabled: auto
  runtime_mode: back_to_back
  serial_port: "/dev/ttyACM0"
  measured_inference_runs: 10
  dut_ready_timeout_s: 12.0
  serial_timeout_s: 12.0
  cpu_clock_mhz_options: [200, 300, 400, 600, 800]
  harness_serial_port: "/dev/ttyACM1"
  harness_fqbn: "arduino:mbed_nano:nano33ble"
  harness_auto_flash: "once"
  harness_ready_timeout_s: 5.0
  harness_arm_timeout_s: 5.0
  harness_active_timeout_s: 30.0
  harness_done_timeout_s: 5.0
  stm32:
    project_root: "sketches/stm32/tinyodom_stm32_lrun"
    appli_flash_address: "0x70100000"
    wake_margin_us: 5000
    min_sleep_us: 5000
    weight_storage_mode: "external_flash"
    weights_memory_pool: "src/config/stm32_nucleo_mypool.json"

dataset:
  name: oxiod
  params:
    sampling_rate_hz: 100
    window_size: 200
    stride: 20
    directory: "data/oxiod/"
    calibration_windows: 10000

task:
  name: odometry_regression
  params:
    early_stopping_patience: 40

model:
  family: odom_tcn
  params:
    export_variant: approx_trained
  search: {}

training:
  nas_epochs: 55
  model_epochs: 990
  nas_trials: 250
  nas_multiobjective_population_size: 50
  max_total_trials: 300
  quantization:
    mode: int8_ptq
    search: true
    choices: [float, int8_ptq]
  latency_proxy_max_flops: 30000000.0
  train: true
  energy_aware: true
  input_mode: "uniform"

nas:
  score:
    type: multi-objective
    params:
      objectives:
        - metric: rmse_total
          direction: minimize
        - metric: energy_mj_per_inference
          direction: minimize
  prune:
    rules: []

# Alternative scalar NAS example.
# Uncomment and adapt this block if you want one weighted score instead of a
# Pareto front. This shape rewards lower RMSE, lightly penalizes RAM and flash,
# gates latency against the deployment budget, and compares energy against a
# budget derived from power and latency.
#
# nas:
#   score:
#     type: scoring-function
#     metrics:
#       total_flash_bytes:
#         type: add
#         metrics:
#           - flash_bytes
#           - external_flash_bytes
#       energy_budget_mj:
#         type: energy-budget-from-power
#         power_mw:
#           type: literal
#           value: 100.0
#         duration_ms:
#           type: metric
#           metric: latency_budget_ms
#     params:
#       terms:
#         - type: weighted
#           metric: rmse_total
#           weight: -1.0
#         - type: normalized-weighted
#           metric: ram_bytes
#           weight: 0.01
#           reference:
#             type: metric
#             metric: max_ram_bytes
#         - type: normalized-weighted
#           metric: total_flash_bytes
#           weight: 0.01
#           reference:
#             type: metric
#             metric: max_flash_bytes
#         - type: boundary
#           metric: latency_ms
#           weight: 1.0
#           reference:
#             type: metric
#             metric: latency_budget_ms
#         - type: target
#           metric: energy_mj_per_inference
#           weight: 0.15
#           reference:
#             type: metric
#             metric: energy_budget_mj
#   feasibility:
#     train_if_infeasible: false
#     rules:
#       - rule: latency_budget
#         metric: latency_ms
#         condition: gt
#         reference:
#           type: metric
#           metric: latency_budget_ms
#         reason: "Latency exceeds deployment budget"
#       # - rule: energy_budget
#       #   metric: energy_mj_per_inference
#       #   condition: gt
#       #   reference:
#       #     type: metric
#       #     metric: energy_budget_mj
#       #   reason: "Energy exceeds deployment budget"

# Alternative cadenced multi-objective NAS example.
# Uncomment this block if you want a Pareto front for cadenced execution:
# one objective minimizes prediction error and the other minimizes cadenced
# energy per scheduled window.
#
# device:
#   runtime_mode: cadenced
#
# nas:
#   score:
#     type: multi-objective
#     params:
#       objectives:
#         - metric: rmse_total
#           direction: minimize
#         - metric: cadenced_energy_mj_per_window
#           direction: minimize
#   feasibility:
#     train_if_infeasible: false
#     rules:
#       - rule: cadenced_deadline_budget
#         metric: cadenced_deadline_miss_count
#         condition: gt
#         reference:
#           type: literal
#           value: 0
#         reason: "Cadenced deadline missed"

# Alternative cadenced-feasibility scalar example.
# Uncomment and adapt this shape if you want cadenced schedulability as a
# constrained deployability policy before training. The same rule shape works
# for scalar and multi-objective scores.
#
# nas:
#   score:
#     type: scoring-function
#     metrics:
#       total_flash_bytes:
#         type: add
#         metrics:
#           - flash_bytes
#           - external_flash_bytes
#       energy_budget_mj:
#         type: energy-budget-from-power
#         power_mw:
#           type: literal
#           value: 100.0
#         duration_ms:
#           type: metric
#           metric: latency_budget_ms
#     params:
#       terms:
#         - type: weighted
#           metric: rmse_total
#           weight: -1.0
#         - type: normalized-weighted
#           metric: ram_bytes
#           weight: 0.01
#           reference:
#             type: metric
#             metric: max_ram_bytes
#         - type: normalized-weighted
#           metric: total_flash_bytes
#           weight: 0.01
#           reference:
#             type: metric
#             metric: max_flash_bytes
#         - type: target
#           metric: cadenced_energy_mj_per_window
#           weight: 0.15
#           reference:
#             type: metric
#             metric: energy_budget_mj
#   feasibility:
#     train_if_infeasible: false
#     rules:
#       - rule: latency_budget
#         metric: latency_ms
#         condition: gt
#         reference:
#           type: metric
#           metric: latency_budget_ms
#         reason: "Latency exceeds deployment budget"
#       - rule: cadenced_deadline_budget
#         metric: cadenced_deadline_miss_count
#         condition: gt
#         reference:
#           type: literal
#           value: 0
#         reason: "Cadenced deadline missed"
#       - rule: cadenced_active_latency_budget
#         metric: cadenced_active_inference_latency_ms
#         condition: gt
#         reference:
#           type: metric
#           metric: latency_budget_ms
#         reason: "Cadenced active inference exceeds slot budget"
#       # - rule: cadenced_phase_ok
#       #   metric: cadenced_error_code
#       #   condition: gt
#       #   reference:
#       #     type: literal
#       #     value: 0
#       #   reason: "Cadenced phase failed"

# Alternative non-HIL scalar example.
# Uncomment and adapt this shape if you want `device.hil: false` and do not
# want the score to depend on measured latency or energy. In proxy mode those
# metrics are unavailable, so keep the score/prune/feasibility policy limited
# to metrics that still exist before training or after proxy-only compilation.
#
# device:
#   hil: false
#   compile_when_hil_disabled: false
#
# nas:
#   score:
#     type: scoring-function
#     metrics:
#       total_flash_bytes:
#         type: add
#         metrics:
#           - flash_bytes
#           - external_flash_bytes
#     params:
#       terms:
#         - type: weighted
#           metric: rmse_total
#           weight: -1.0
#         - type: normalized-weighted
#           metric: ram_bytes
#           weight: 0.01
#           reference:
#             type: metric
#             metric: max_ram_bytes
#         - type: normalized-weighted
#           metric: total_flash_bytes
#           weight: 0.01
#           reference:
#             type: metric
#             metric: max_flash_bytes
#         - type: normalized-weighted
#           metric: flops
#           weight: 0.01
#           reference:
#             type: literal
#             value: 30000000.0
#   prune:
#     rules: []

outputs:
  models_dir: "models"
  candidate_dir: "odom_tcn"
  artifact_stem: "TinyOdomEx_OxIOD_STM32"
  log_file_name: "log_NAS_TinyOdomEx_OxIOD_STM32.csv"

network:
  host: "127.0.0.1"
  port: 6001
  recv_timeout_sec: 720
  send_timeout_sec: 720

logging:
  level: "INFO"
