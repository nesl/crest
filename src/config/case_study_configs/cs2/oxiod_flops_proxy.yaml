# CS2 source study: OxIOD_FLOPS_PROXY_MIXED_case1_1_20261027
# Original YAML SHA256: 366d6fb07d992a6202d80a40293129eda7de1c2c65175cea9c0963be0ccc2b2a
# Launch from repository root:
#   python src/nas_model_client.py --config src/config/case_study_configs/cs2/oxiod_flops_proxy.yaml --study-name cs2_oxiod_flops_proxy
# Historical campaign settings; fresh execution does not reproduce historical randomness.
# STM32 firmware and pool paths relocated to the current repository layout.

device:
  name: STM32_NUCLEO_N657X0_Q
  hil: false
  compile_when_hil_disabled: false
  runtime_mode: back_to_back
  serial_port: /dev/ttyACM0
  measured_inference_runs: 10
  dut_ready_timeout_s: 12.0
  serial_timeout_s: 12.0
  stm32:
    project_root: firmware/stm32/crest_stm32_lrun
    appli_flash_address: '0x70100000'
    weight_storage_mode: external_flash
    weights_memory_pool: src/config/stm32_nucleo_mypool.json
dataset:
  name: oxiod
  params:
    sampling_rate_hz: 100
    window_size: 200
    stride: 20
    directory: data/oxiod/
    calibration_windows: 10000
task:
  name: odometry_regression
  params:
    early_stopping_patience: 40
model:
  family: odom_tcn
  params:
    export_variant: approx_trained
  search: {}
training:
  random_seed: 42
  deterministic_ops: false
  nas_epochs: 55
  model_epochs: 990
  nas_trials: 150
  nas_multiobjective_population_size: 50
  max_total_trials: 150
  quantization:
    mode: int8_ptq
    search: true
    choices:
    - float
    - int8_ptq
  latency_proxy_max_flops: 30000000.0
  train: true
  energy_aware: false
  input_mode: uniform
nas:
  score:
    type: multi-objective
    params:
      objectives:
      - metric: rmse_total
        direction: minimize
      - metric: flops
        direction: minimize
  prune:
    rules: []
outputs:
  models_dir: models/case_studies/cs2/oxiod_flops_proxy
  candidate_dir: odom_tcn
  artifact_stem: OxIOD_FLOPS_PROXY_MIXED_case1_1_20261027
  log_file_name: log_NAS_OxIOD_FLOPS_PROXY_MIXED_case1_1_20261027.csv
network:
  host: 127.0.0.1
  port: 6001
  recv_timeout_sec: 720
  send_timeout_sec: 720
logging:
  level: INFO
