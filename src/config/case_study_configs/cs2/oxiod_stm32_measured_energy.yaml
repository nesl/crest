# CS2 source study: OxIOD_STM32_B2B_case1_5_t1
# Original YAML SHA256: 1190f528a78193f21595fc002fe9d8da3317860f86b7e4a7fae8a7342e7ee852
# Launch from repository root:
#   python src/nas_model_client.py --config src/config/case_study_configs/cs2/oxiod_stm32_measured_energy.yaml --study-name cs2_oxiod_stm32_measured_energy
# Historical campaign settings; fresh execution does not reproduce historical randomness.
# STM32 firmware and pool paths relocated to the current repository layout.

device:
  name: STM32_NUCLEO_N657X0_Q
  hil: true
  compile_when_hil_disabled: auto
  runtime_mode: back_to_back
  serial_port: /dev/ttyACM0
  measured_inference_runs: 10
  dut_ready_timeout_s: 12.0
  serial_timeout_s: 12.0
  cpu_clock_mhz_options:
  - 200
  - 300
  - 400
  - 600
  - 800
  harness_serial_port: /dev/ttyACM1
  harness_fqbn: arduino:mbed_nano:nano33ble
  harness_auto_flash: once
  harness_ready_timeout_s: 5.0
  harness_arm_timeout_s: 5.0
  harness_active_timeout_s: 30.0
  harness_done_timeout_s: 5.0
  stm32:
    project_root: firmware/stm32/crest_stm32_lrun
    appli_flash_address: '0x70100000'
    wake_margin_us: 5000
    min_sleep_us: 5000
    weight_storage_mode: external_flash
    weights_memory_pool: src/config/stm32_nucleo_mypool.json
dataset:
  name: oxiod
  params:
    sampling_rate_hz: 100
    window_size: 200
    stride: 20
    directory: data/oxiod/
    calibration_windows: 10000
task:
  name: odometry_regression
  params:
    early_stopping_patience: 40
model:
  family: odom_tcn
  params:
    export_variant: approx_trained
  search: {}
training:
  nas_epochs: 55
  model_epochs: 990
  nas_trials: 250
  nas_multiobjective_population_size: 50
  max_total_trials: 300
  quantization:
    mode: int8_ptq
    search: true
    choices:
    - float
    - int8_ptq
  latency_proxy_max_flops: 30000000.0
  train: true
  energy_aware: true
  input_mode: uniform
nas:
  score:
    type: multi-objective
    params:
      objectives:
      - metric: rmse_total
        direction: minimize
      - metric: energy_mj_per_inference
        direction: minimize
  prune:
    rules: []
outputs:
  models_dir: models/case_studies/cs2/oxiod_stm32_measured_energy
  candidate_dir: odom_tcn
  artifact_stem: OxIOD_STM32_B2B_case1_5
  log_file_name: log_NAS_OxIOD_STM32_B2B_case1_5.csv
network:
  host: 127.0.0.1
  port: 6001
  recv_timeout_sec: 720
  send_timeout_sec: 720
logging:
  level: INFO
