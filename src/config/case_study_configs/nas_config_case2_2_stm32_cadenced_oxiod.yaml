# Case 2.2: STM32 N657 OxIOD measured-energy NAS, cadenced runtime,
# with post-HIL cadenced feasibility constraints.
#
# Intended launch on the GPU host:
#   CUDA_VISIBLE_DEVICES=1 TF_FORCE_GPU_ALLOW_GROWTH=true \
#   python src/nas_model_client.py \
#     --config src/config/case_study_configs/nas_config_case2_2_stm32_cadenced_oxiod.yaml \
#     --study-name OxIOD_STM32_CADENCED_case2_2

device:
  name: STM32_NUCLEO_N657X0_Q
  hil: true
  compile_when_hil_disabled: auto
  runtime_mode: cadenced
  serial_port: "/dev/ttyACM0"
  measured_inference_runs: 10
  dut_ready_timeout_s: 12.0
  serial_timeout_s: 12.0
  cpu_clock_mhz_options: [200, 300, 400, 600, 800]
  harness_serial_port: "/dev/ttyACM1"
  harness_fqbn: "arduino:mbed_nano:nano33ble"
  harness_auto_flash: "once"
  harness_ready_timeout_s: 5.0
  harness_arm_timeout_s: 5.0
  harness_active_timeout_s: 30.0
  harness_done_timeout_s: 5.0
  stm32:
    project_root: "sketches/stm32/tinyodom_stm32_lrun"
    appli_flash_address: "0x70100000"
    wake_margin_us: 5000
    min_sleep_us: 5000
    weight_storage_mode: "external_flash"
    weights_memory_pool: "src/config/stm32_nucleo_mypool.json"

dataset:
  name: oxiod
  params:
    sampling_rate_hz: 100
    window_size: 200
    stride: 20
    directory: "data/oxiod/"
    calibration_windows: 10000

task:
  name: odometry_regression
  params:
    early_stopping_patience: 40

model:
  family: odom_tcn
  params:
    export_variant: approx_trained
  search: {}

training:
  nas_epochs: 55
  model_epochs: 990
  # Feasibility-enabled NAS targets this many feasible completed trials.
  nas_trials: 256
  nas_multiobjective_population_size: 64
  # Infeasible, pruned, and failed attempts consume this larger cap.
  max_total_trials: 600
  quantization:
    mode: int8_ptq
    search: true
    choices: [float, int8_ptq]
  latency_proxy_max_flops: 30000000.0
  train: true
  energy_aware: true
  input_mode: "uniform"

nas:
  score:
    type: multi-objective
    params:
      objectives:
        - metric: rmse_total
          direction: minimize
        - metric: cadenced_energy_mj_per_window
          direction: minimize
  feasibility:
    train_if_infeasible: false
    rules:
      - rule: latency_budget
        metric: latency_ms
        condition: gt
        reference:
          type: metric
          metric: latency_budget_ms
        reason: "Latency exceeds deployment budget"

outputs:
  models_dir: "models"
  candidate_dir: "odom_tcn"
  artifact_stem: "OxIOD_STM32_CADENCED_case2_2"
  log_file_name: "log_NAS_OxIOD_STM32_CADENCED_case2_2.csv"

network:
  host: "127.0.0.1"
  port: 6001
  recv_timeout_sec: 720
  send_timeout_sec: 720

logging:
  level: "INFO"
