# Case 1.2: Arduino Nano 33 BLE Sense OxIOD measured-energy NAS, back-to-back runtime.
#
# Intended launch on the GPU host:
#   CUDA_VISIBLE_DEVICES=1 TF_FORCE_GPU_ALLOW_GROWTH=true \
#   python src/nas_model_client.py \
#     --config src/config/case_study_configs/nas_config_case1_2_ble33_b2b_oxiod.yaml \
#     --study-name OxIOD_BLE33_B2B_case1_2

device:
  name: ARDUINO_NANO_33_BLE_SENSE
  hil: true
  compile_when_hil_disabled: auto
  runtime_mode: back_to_back
  serial_port: "/dev/ttyACM0"
  measured_inference_runs: 10
  dut_ready_timeout_s: 12.0
  serial_timeout_s: 12.0
  harness_serial_port: "/dev/ttyACM1"
  harness_fqbn: "arduino:mbed_nano:nano33ble"
  harness_auto_flash: "once"
  harness_ready_timeout_s: 5.0
  harness_arm_timeout_s: 5.0
  harness_active_timeout_s: 30.0
  harness_done_timeout_s: 5.0

dataset:
  name: oxiod
  params:
    sampling_rate_hz: 100
    window_size: 200
    stride: 20
    directory: "data/oxiod/"
    calibration_windows: 10000

task:
  name: odometry_regression
  params:
    early_stopping_patience: 40

model:
  family: odom_tcn
  params:
    export_variant: approx_trained
  search: {}

training:
  nas_epochs: 55
  model_epochs: 990
  nas_trials: 150
  nas_multiobjective_population_size: 50
  max_total_trials: 300
  quantization:
    mode: int8_ptq
    search: true
    choices: [float, int8_ptq]
  latency_proxy_max_flops: 30000000.0
  train: true
  energy_aware: true
  input_mode: "uniform"

nas:
  score:
    type: multi-objective
    params:
      objectives:
        - metric: rmse_total
          direction: minimize
        - metric: energy_mj_per_inference
          direction: minimize
  prune:
    rules: []

outputs:
  models_dir: "models"
  candidate_dir: "odom_tcn"
  artifact_stem: "OxIOD_BLE33_B2B_case1_2"
  log_file_name: "log_NAS_OxIOD_BLE33_B2B_case1_2.csv"

network:
  host: "127.0.0.1"
  port: 6001
  recv_timeout_sec: 720
  send_timeout_sec: 720

logging:
  level: "INFO"
