name: crest
channels:
  - conda-forge
dependencies:
  # Core runtime shared by CREST data, hardware, notebooks, and tests
  - python=3.11
  - numpy
  - pandas
  - scikit-learn        # sklearn.metrics + preprocessing in notebooks
  - matplotlib          # src/data_visualization.ipynb animations/plots
  - tqdm                # progress bars in dataset preparation and loaders
  - ipykernel           # notebook execution
  - ipywidgets          # interactive widgets in notebooks (optional but lightweight)
  - pytest              # ensure test runner shares interpreter with installed deps
  - pyserial==3.5       # serial communication with microcontroller
  - libsndfile=1.2.2    # exact native audio backend for pip-pinned soundfile
  - pip
  - pip:
      # Embedded ML / HPO stack. See README.md for optional GPU TensorFlow setup.
      - tensorflow==2.20.0
      - tensorflow-io-gcs-filesystem==0.37.1
      - tensorflow-model-optimization==0.8.0
      - keras-tcn==3.5.6
      - keras-flops==0.1.2
      - tf-keras==2.20.1
      - optuna==4.6.0
      - addict==2.4.0
      - pyyaml==6.0.2
      # Dataset utilities
      - giotto-tda==0.6.2         # SlidingWindow in src/crest/data.py
      - numpy-quaternion==2024.0.12
      - pydometer==2019.2.8
      - soundata==1.0.1
      - librosa==0.11.0
      - soundfile==0.13.1
