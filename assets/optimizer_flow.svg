<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="2330" viewBox="0 0 1760 2330" role="img" aria-labelledby="title desc">
<title id="title">CREST: two proposal strategies, one evaluation pipeline</title>
<desc id="desc">The shared runner resolves optimizer configuration and opens a persistent Optuna study, checks stored identity, and initializes immutable proposal context and the component before persisting new study signatures. Each loop checks the completion target first, executes the oldest reserved WAITING group before the attempt cap, then gives a budget and history snapshot to the selected optimizer. Native Optuna returns a NativeRound count without enqueueing; sampling occurs inside the existing objective. The LLM builds context and history with optional memory, calls a provider with validation, repair and fallback, and returns explicit candidates. The runner validates the entire explicit batch and enqueues candidates with study provenance. Both paths and resumed reservations execute study.optimize with the same objective. Shared evaluation builds models, measures resources, rejects before fitting when necessary, trains when enabled, scores and logs. Optuna records completion and sampler hooks update history for the next round. Final artifacts include CSV, final model or Pareto results and replay evidence.</desc>
<metadata>Hand-positioned SVG; optimizer_flow.mmd is the editable flow topology, not the rendering source. PNG exported from SVG with rsvg-convert.</metadata>
<defs>
  <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#536578"/></marker>
  <marker id="blueArrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#2678ad"/></marker>
  <marker id="violetArrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#7956b1"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#243449" flood-opacity=".07"/></filter>
</defs>
