<rect width="1760" height="2330" fill="#f8fafc"/>

<text x="120" y="63" class="kicker" style="fill:#607288">CREST SEARCH ARCHITECTURE</text>
<text x="120" y="123" class="title" >Two proposal strategies. One evaluation pipeline.</text>
<text x="120" y="162" class="subtitle" >The optimizer proposes a round; the CREST runner owns trials, budgets and evaluation.</text>
<rect x="120" y="190" width="210" height="35" rx="17.5" fill="#eaf0f5"/>
<text x="225.0" y="214" class="small" text-anchor="middle" style="fill:#43566b;font-weight:600">Shared runner</text>
<rect x="348" y="190" width="220" height="35" rx="17.5" fill="#e5f2fc"/>
<text x="458.0" y="214" class="small" text-anchor="middle" style="fill:#2678ad;font-weight:600">Native Optuna</text>
<rect x="586" y="190" width="230" height="35" rx="17.5" fill="#efe8fa"/>
<text x="701.0" y="214" class="small" text-anchor="middle" style="fill:#7956b1;font-weight:600">LLM generator</text>
<text x="120" y="269" class="kicker" style="fill:#607288">01  INITIALIZE ONCE</text>
<path d="M 552 343 H 605" class="edge"/>
<path d="M 1095 343 H 1145" class="edge"/>
<path d="M 1400 416 V 446 H 880 V 476" class="edge"/>
<path d="M 880 667 V 717" class="edge"/>
<path d="M 880 837 V 857 H 482 V 969" class="edge native"/>
<path d="M 880 857 H 1240 V 940" class="edge llm"/>
<path d="M 1240 1075 V 1120" class="edge llm"/>
<path d="M 1240 1255 V 1300" class="edge llm"/>
<path d="M 1240 1440 V 1470" class="edge llm"/>
<path d="M 1240 1605 V 1668" class="edge llm"/>
<path d="M 482 1124 V 1152 H 185 V 1626 H 700 V 1668" class="edge native"/>
<path d="M 1440 564 H 1640 V 1729 H 1460" class="edge"/>
<path d="M 1440 515 H 1715 V 2182 H 1460" class="edge"/>
<path d="M 360 2050 H 78 V 574 H 360" class="edge feedback"/>
<path d="M 880 1788 V 1845" class="edge"/>
<path d="M 880 1980 V 2014" class="edge"/>
<rect x="120" y="296" width="432" height="120" rx="18" fill="#ffffff" stroke="#d7e0e9" stroke-width="1.7" filter="url(#shadow)"/>
<text x="148" y="339" class="heading" >Config + component registry</text>
<text x="148" y="376" class="body" >Resolve optimizer type; validate config.</text>
<rect x="605" y="296" width="490" height="120" rx="18" fill="#ffffff" stroke="#d7e0e9" stroke-width="1.7" filter="url(#shadow)"/>
<text x="633" y="339" class="heading" >Create or resume Optuna study</text>
<text x="633" y="376" class="body" >Sampler, directions; check stored identity.</text>
<rect x="1145" y="296" width="495" height="120" rx="18" fill="#ffffff" stroke="#d7e0e9" stroke-width="1.7" filter="url(#shadow)"/>
<text x="1173" y="333" class="heading" >Initialize proposal component</text>
<text x="1173" y="369" class="body" >Required context; initialize component.</text>
<text x="1173" y="398" class="body" >Then persist new study signatures.</text>
<text x="120" y="457" class="kicker" style="fill:#607288">02  SHARED ROUND CONTROL</text>
<rect x="360" y="476" width="1080" height="191" rx="18" fill="#f0f5fa" stroke="#b6c7d9" stroke-width="1.7" filter="url(#shadow)"/>
<rect x="360" y="496" width="5" height="151" rx="2.5" fill="#506b88"/>
<text x="388" y="519" class="heading" >Check target, reservations, then budget</text>
<text x="388" y="556" class="body" >1. Target qualifying completions met? Stop.</text>
<text x="388" y="586" class="body" >2. Else oldest WAITING group exists? Execute those reserved trials first.</text>
<text x="388" y="616" class="body" >3. Else total attempt cap reached? Stop. Otherwise prepare a new proposal.</text>
<text x="894" y="702" class="small" >new proposal permitted</text>
<rect x="500" y="717" width="760" height="120" rx="18" fill="#f0f5fa" stroke="#b6c7d9" stroke-width="1.7" filter="url(#shadow)"/>
<text x="528" y="760" class="heading" >BudgetSnapshot + immutable TrialRecord history</text>
<text x="528" y="797" class="body" >Compute permitted size; call propose_round(history, budget).</text>
<rect x="160" y="912" width="645" height="620" rx="24" fill="#eef7fd" stroke="#cde5f5" stroke-width="1.4"/>
<rect x="915" y="912" width="650" height="548" rx="24" fill="#f5f0fc" stroke="#dfd3ef" stroke-width="1.4"/>
<path d="M 482 912 V 969" class="edge native"/>
<path d="M 1240 912 V 940" class="edge llm"/>
<path d="M 1240 1075 V 1120" class="edge llm"/>
<path d="M 1240 1255 V 1300" class="edge llm"/>
<path d="M 482 1124 V 1152 H 185 V 1532" fill="none" stroke="#2678ad" stroke-width="2.7"/>
<path d="M 1240 1440 V 1470" class="edge llm"/>
<text x="160" y="890" class="kicker" style="fill:#2678ad">03A  NATIVE OPTUNA</text>
<text x="915" y="890" class="kicker" style="fill:#7956b1">03B  LLM GENERATOR</text>
<rect x="198" y="969" width="569" height="155" rx="18" fill="#ffffff" stroke="#abd2eb" stroke-width="1.7" filter="url(#shadow)"/>
<rect x="198" y="989" width="5" height="115" rx="2.5" fill="#2678ad"/>
<text x="226" y="1012" class="heading" >NativeRound(n)</text>
<text x="226" y="1049" class="body" >Return a permitted count of trials.</text>
<text x="226" y="1079" class="body" >Runner validates n. No candidates are enqueued.</text>
<text x="226" y="1109" class="body" >History is available; native proposer ignores it.</text>
<text x="232" y="1204" class="kicker" style="fill:#2678ad">PARAMETER CHOICE HAPPENS LATER</text>
<text x="232" y="1244" class="body" >Inside the existing objective(), trial.suggest_*</text>
<text x="232" y="1275" class="body" >uses the active Optuna sampler to select values.</text>
<text x="232" y="1342" class="small" >The native component supplies a round size.</text>
<text x="232" y="1373" class="small" >All evaluation follows the shared path below.</text>
<rect x="945" y="940" width="590" height="135" rx="18" fill="#ffffff" stroke="#d0bce9" stroke-width="1.7" filter="url(#shadow)"/>
<rect x="945" y="960" width="5" height="95" rx="2.5" fill="#7956b1"/>
<text x="973" y="983" class="heading" >Build bounded prompt context</text>
<text x="973" y="1020" class="body" >Search space + recent history + best anchors</text>
<text x="973" y="1050" class="body" >+ semantic context and optional derived memory.</text>
<rect x="945" y="1120" width="590" height="135" rx="18" fill="#ffffff" stroke="#d0bce9" stroke-width="1.7" filter="url(#shadow)"/>
<rect x="945" y="1140" width="5" height="95" rx="2.5" fill="#7956b1"/>
<text x="973" y="1163" class="heading" >Provider → validation → repair / fallback</text>
<text x="973" y="1200" class="body" >Validate JSON, raw values and duplicates.</text>
<text x="973" y="1230" class="body" >Repair invalid proposals; unique random fallback.</text>
<rect x="945" y="1300" width="590" height="140" rx="18" fill="#ffffff" stroke="#d0bce9" stroke-width="1.7" filter="url(#shadow)"/>
<rect x="945" y="1320" width="5" height="100" rx="2.5" fill="#7956b1"/>
<text x="973" y="1343" class="heading" >ExplicitRound(candidates)</text>
<text x="973" y="1380" class="body" >Raw mappings + provenance; no study / queue access.</text>
<text x="973" y="1410" class="body" >Ledger stores generation evidence.</text>
<rect x="945" y="1470" width="590" height="135" rx="18" fill="#f0f5fa" stroke="#b6c7d9" stroke-width="1.7" filter="url(#shadow)"/>
<rect x="945" y="1490" width="5" height="95" rx="2.5" fill="#506b88"/>
<text x="973" y="1513" class="heading" >Runner validates the entire raw batch</text>
<text x="973" y="1550" class="body" >Validate every candidate before any queue write.</text>
<text x="973" y="1580" class="body" >Enqueue with crest_proposal trial attributes.</text>
<g transform="translate(1669 1140) rotate(90)"><rect x="-219" y="-25" width="438" height="39" rx="9" fill="#f8fafc"/><text x="0" y="2" text-anchor="middle" class="small">WAITING reservations: bypass proposal generation</text></g>
<g transform="translate(1744 1410) rotate(90)"><rect x="-173" y="-25" width="346" height="39" rx="9" fill="#f8fafc"/><text x="0" y="2" text-anchor="middle" class="small">target met or cap reached → finish</text></g>
<g transform="translate(52 1400) rotate(-90)"><rect x="-196" y="-25" width="392" height="39" rx="9" fill="#f8fafc"/><text x="0" y="2" text-anchor="middle" class="small">updated study evidence → next round</text></g>
<text x="120" y="1647" class="kicker" style="fill:#607288">04  ONE EXECUTION AND FEEDBACK PATH</text>
<rect x="360" y="1668" width="1100" height="120" rx="18" fill="#e9f4f3" stroke="#a7ceca" stroke-width="1.7" filter="url(#shadow)"/>
<rect x="360" y="1688" width="5" height="80" rx="2.5" fill="#27857c"/>
<text x="388" y="1711" class="heading" >study.optimize(existing objective, n_trials=round size)</text>
<text x="388" y="1748" class="body" >Native: sampled trial parameters.  LLM / reservations: enqueued fixed parameters.</text>
<rect x="360" y="1845" width="1100" height="135" rx="18" fill="#e9f4f3" stroke="#a7ceca" stroke-width="1.7" filter="url(#shadow)"/>
<rect x="360" y="1865" width="5" height="95" rx="2.5" fill="#27857c"/>
<text x="388" y="1888" class="heading" >Shared objective: build → measure → gate → train → score → log</text>
<text x="388" y="1925" class="body" >Validate hyperparameters; collect configured resource / HIL metrics; reject before fitting.</text>
<text x="388" y="1955" class="body" >Train when enabled; record feasibility and scalar or multi-objective outcomes.</text>
<rect x="360" y="2014" width="1100" height="105" rx="18" fill="#e9f4f3" stroke="#a7ceca" stroke-width="1.7" filter="url(#shadow)"/>
<text x="388" y="2057" class="heading" >Optuna completion + sampler hooks → persistent study history</text>
<text x="388" y="2094" class="body" >Trial states, actual params, metrics and provenance become the next immutable snapshot.</text>
<rect x="360" y="2145" width="1100" height="110" rx="18" fill="#ffffff" stroke="#d7e0e9" stroke-width="1.7" filter="url(#shadow)"/>
<text x="388" y="2188" class="heading" >After the search stops: results, finalization and replay</text>
<text x="388" y="2225" class="body" >Trials CSV • Pareto results or configured final model • saved config, study + LLM evidence</text>
<text x="120" y="2293" class="small" >CREST • shared proposal and evaluation contract • solid arrows: execution   /   dashed arrows: persisted evidence</text>
</svg>
